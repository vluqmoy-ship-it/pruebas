  <!-- ==========================================================
       ESTILOS
       Colores y fuentes: edita solo las variables de :root
       ========================================================== -->
  <style>
    :root {
      /* Paleta */
      --plum: #6B3E5E;
      --plum-deep: #4A2A40;
      --plum-soft: #8F5A7A;
      --rosa: #E8AABB;
      --rosa-pale: #F5D9E2;
      --rosa-blush: #FDF0F4;
      --cream: #FBF7F4;
      --text-dark: #0E0709;
      --text-mid: #271626;
      --text-light: #3E2438;

      /* Fuentes: Cormorant para títulos (tu marca), Nunito Sans para leer cómodo. */
      --font: 'Cormorant Garamond', serif;
      --font-body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --radius: 20px;
      --maxw: 1120px;
      --shadow: 0 12px 32px rgba(74, 42, 64, .12);
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.65;
      color: var(--text-mid);
      background: var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 {
      font-family: var(--font);
      color: var(--text-dark);
      font-weight: 700;
      line-height: 1.08;
      margin: 0 0 1rem;
    }
    h1 { font-size: clamp(2.7rem, 7vw, 4.5rem); }
    h2 { font-size: clamp(2.1rem, 5vw, 3.2rem); }
    h3 { font-size: 1.55rem; line-height: 1.2; }
    em { font-style: italic; color: var(--plum); }
    p { margin: 0 0 1.1rem; }
    a { color: var(--plum); }
    img { max-width: 100%; height: auto; }

    .container { width: min(100% - 2.5rem, var(--maxw)); margin-inline: auto; }
    .center { text-align: center; }
    .skip { position: absolute; left: -999px; top: 0; background: var(--plum); color: #fff; padding: .6rem 1rem; z-index: 100; }
    .skip:focus { left: 0; }
    :focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; }

    /* ---------- Botones ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 54px; padding: .9rem 1.9rem;
      border-radius: 999px; border: 0; cursor: pointer;
      font-family: var(--font-body); font-size: 1.05rem; font-weight: 800;
      text-decoration: none; text-align: center;
      transition: transform .15s, background .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: .7; cursor: wait; transform: none; }
    .btn--primary { background: var(--plum); color: #fff; box-shadow: 0 8px 20px rgba(107, 62, 94, .35); }
    .btn--primary:hover { background: var(--plum-deep); }
    .btn--accent { background: var(--rosa); color: var(--plum-deep); box-shadow: 0 8px 22px rgba(0, 0, 0, .25); }
    .btn--accent:hover { background: var(--rosa-pale); }
    .btn--small { min-height: 42px; padding: .5rem 1.2rem; font-size: .95rem; }
    .btn--block { width: 100%; }

    /* ---------- Cabecera ---------- */
    .header { position: sticky; top: 0; z-index: 50; background: var(--plum-deep); }
    .header__inner { display: flex; align-items: center; justify-content: space-between; min-height: 68px; }
    .logo { font-family: var(--font); font-size: 2rem; font-weight: 700; color: #fff; text-decoration: none; letter-spacing: .02em; }

    /* ---------- Hero ---------- */
    .hero {
      background: linear-gradient(160deg, var(--plum-deep) 0%, var(--plum) 100%);
      color: var(--rosa-blush);
      padding: clamp(2.5rem, 6vw, 5rem) 0 clamp(3rem, 7vw, 5.5rem);
    }
    .hero__grid { display: grid; gap: 2.4rem; grid-template-columns: 1fr; }
    @media (min-width: 920px) {
      .hero__grid { grid-template-columns: 1.1fr .9fr; gap: 3.5rem; align-items: center; }
      .hero__cta-mobile { display: none; }
    }
    .eyebrow {
      display: inline-block; text-transform: uppercase; letter-spacing: .14em;
      font-size: .8rem; font-weight: 800; color: var(--rosa); margin-bottom: 1rem;
    }
    .hero h1 { color: #fff; }
    .hero h1 em { color: var(--rosa); }
    .hero__lead { font-size: 1.25rem; color: var(--rosa-pale); max-width: 34rem; }
    .checks { list-style: none; padding: 0; margin: 1.4rem 0 1.8rem; display: grid; gap: .6rem; }
    .checks li { position: relative; padding-left: 2rem; font-weight: 600; }
    .checks li::before {
      content: "✓"; position: absolute; left: 0; top: .1rem;
      width: 1.4rem; height: 1.4rem; border-radius: 50%;
      background: var(--rosa); color: var(--plum-deep);
      font-size: .85rem; font-weight: 800; display: grid; place-items: center; line-height: 1;
    }

    /* ---------- Formulario ---------- */
    .form-card {
      background: var(--cream); color: var(--text-mid);
      border-radius: 24px; padding: 1.7rem;
      box-shadow: 0 24px 60px rgba(14, 7, 9, .35);
    }
    .form-card h2 { font-size: 2rem; color: var(--plum-deep); margin-bottom: .4rem; }
    .form-card__sub { font-size: 1rem; color: var(--text-light); margin-bottom: 1.2rem; }
    .lead-form label { display: block; font-size: .95rem; font-weight: 700; color: var(--text-dark); margin-bottom: .9rem; }
    .lead-form .opt { font-weight: 400; color: var(--text-light); }
    .lead-form input[type="text"],
    .lead-form input[type="email"],
    .lead-form textarea {
      display: block; width: 100%; margin-top: .3rem;
      padding: .85rem 1rem; border: 2px solid var(--rosa-pale); border-radius: 12px;
      background: #fff; color: var(--text-dark);
      font-family: var(--font-body); font-size: 1rem;
    }
    .lead-form textarea { resize: vertical; min-height: 84px; }
    .lead-form input:focus, .lead-form textarea:focus { border-color: var(--plum); outline: none; }
    .lead-form .check { display: flex; gap: .6rem; align-items: flex-start; font-weight: 400; font-size: .88rem; color: var(--text-light); }
    .lead-form .check input { margin-top: .25rem; width: 18px; height: 18px; flex: none; accent-color: var(--plum); }
    .hp { position: absolute; left: -9999px; }
    .form-micro { font-size: .88rem; text-align: center; color: var(--text-light); margin: .9rem 0 0; }
    .form-status { margin: .8rem 0 0; font-weight: 700; text-align: center; }
    .form-status:empty { display: none; }
    .form-status.is-ok { color: #1f6b3a; }
    .form-status.is-error { color: #a12a2a; }

    /* ---------- Franja de confianza ---------- */
    .trust { background: #fff; border-bottom: 1px solid var(--rosa-pale); }
    .trust__list {
      list-style: none; margin: 0; padding: 1.2rem 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1.2rem;
    }
    @media (min-width: 820px) { .trust__list { grid-template-columns: repeat(4, 1fr); } }
    .trust__list li { font-weight: 700; font-size: .98rem; color: var(--plum-deep); display: flex; gap: .6rem; align-items: center; line-height: 1.3; }
    .trust__list li::before {
      content: "✓"; flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%;
      background: var(--rosa-pale); color: var(--plum); font-weight: 800; font-size: .85rem;
      display: grid; place-items: center;
    }

    /* ---------- Secciones ---------- */
    .section { padding: clamp(3.5rem, 8vw, 6rem) 0; }
    .section--blush { background: var(--rosa-blush); }
    .section--rosa { background: var(--rosa-pale); }
    .section--dark { background: var(--plum-deep); color: var(--rosa-blush); }
    .section--dark h2 { color: #fff; }
    .section--dark em { color: var(--rosa); }
    .section__head { max-width: 46rem; margin-bottom: 2.4rem; }
    .section__head.center { margin-inline: auto; }
    .section__head p { font-size: 1.2rem; color: var(--text-light); }
    .section--dark .section__head p { color: var(--rosa-pale); }

    /* ---------- ¿Te suena? ---------- */
    .cards { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 700px) { .cards { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1000px) { .cards { grid-template-columns: repeat(3, 1fr); } }
    .quote {
      background: #fff; border-radius: var(--radius); padding: 1.5rem 1.4rem 1.4rem;
      box-shadow: var(--shadow); border-top: 5px solid var(--rosa);
      font-family: var(--font); font-size: 1.45rem; line-height: 1.25; font-weight: 600; color: var(--plum-deep);
    }
    .reassure {
      margin: 2.2rem auto 0; max-width: 44rem; text-align: center;
      font-size: 1.2rem; color: var(--text-dark);
    }
    .reassure strong { color: var(--plum); }
    .cta-row { text-align: center; margin-top: 1.6rem; }

    /* ---------- Enfoque ---------- */
    .split { display: grid; gap: 2.5rem; grid-template-columns: 1fr; align-items: start; }
    @media (min-width: 900px) { .split { grid-template-columns: 1fr 1fr; gap: 4rem; } }
    .principles { display: grid; gap: 1rem; }
    .principle { background: #fff; border-radius: var(--radius); padding: 1.3rem 1.4rem; box-shadow: var(--shadow); }
    .principle h3 { color: var(--plum); margin-bottom: .3rem; font-size: 1.45rem; }
    .principle p { margin: 0; }

    /* ---------- Precio ---------- */
    .price {
      max-width: 40rem; margin-inline: auto; background: #fff;
      border-radius: 28px; padding: 2.2rem 1.8rem; box-shadow: var(--shadow);
      border: 2px solid var(--rosa); text-align: center;
    }
    .price__amount { font-family: var(--font); font-size: 5rem; font-weight: 700; color: var(--plum); line-height: 1; }
    .price__unit { display: block; font-weight: 700; color: var(--text-light); margin: .3rem 0 1.4rem; }
    .price .checks { text-align: left; max-width: 28rem; margin: 0 auto 1.8rem; }
    .price .checks li::before { background: var(--rosa-pale); color: var(--plum); }

    /* ---------- Sobre mí ---------- */
    .about {
      display: grid; grid-template-columns: 1fr; gap: 2.2rem; align-items: start;
    }
    .about__media {
      position: relative; width: min(100%, 280px); margin-inline: auto;
    }
    .about__media::before {
