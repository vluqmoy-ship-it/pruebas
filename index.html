  <style>
    :root {
      /* Nueva Paleta de Rebranding */
      --bg-canvas:     #FDFBF7; /* Lino Cálido */
      --bg-card:       #FFFFFF;
      --bg-subtle:     #F7F2EB; /* Rosa/Crema suave */

      --plum-deep:     #3D2B3D; /* Morado Berenjena / Texto principal */
      --plum-mid:      #6A4E6A; /* Morado medio */
      --rosa-seco:     #8C6374; /* Borgoña/Rosa seco */
      --rosa-pale:     #EAD7DF; /* Rosa pálido de acento */

      --sage-green:    #4A6B5D; /* Verde Salvia (Color de conversión y CTA) */
      --sage-hover:    #3B574B;

      --text-dark:     #2B1E2B;
      --text-mid:      #4D3D4D;
      --text-muted:    #736173;

      --font-title: 'Cormorant Garamond', serif;
      --font-body:  'Plus Jakarta Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-canvas);
      color: var(--text-dark);
      overflow-x: hidden;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.7;
    }

    /* ── NAVEGACIÓN ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 1.1rem 2rem;
      background: rgba(253, 251, 247, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(140, 99, 116, 0.12);
      transition: all 0.3s ease;
    }
    nav.scrolled {
      box-shadow: 0 4px 20px rgba(61, 43, 61, 0.05);
    }
    .nav-inner {
      max-width: 1140px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo {
      font-family: var(--font-title);
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--plum-deep);
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }
    .nav-links a {
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-mid);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--rosa-seco); }
    
    .nav-cta {
      background: var(--sage-green) !important;
      color: #FFFFFF !important;
      padding: 0.55rem 1.4rem;
      border-radius: 100px;
      font-weight: 500 !important;
      transition: background 0.25s ease, transform 0.2s ease !important;
      box-shadow: 0 4px 12px rgba(74, 107, 93, 0.2);
    }
    .nav-cta:hover {
      background: var(--sage-hover) !important;
      transform: translateY(-1px);
    }

    #menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem;
      flex-direction: column;
      gap: 5px;
    }
    .hamburger-line {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--plum-deep);
      border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8.5rem 2rem 5rem;
      position: relative;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 80% 20%, rgba(234, 215, 223, 0.45) 0%, transparent 50%),
        radial-gradient(circle at 10% 80%, rgba(74, 107, 93, 0.08) 0%, transparent 45%);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 1140px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 4rem;
      align-items: center;
    }
    .hero-title-main {
      font-family: var(--font-title);
      font-size: clamp(2.8rem, 4.2vw, 4.2rem);
      font-weight: 500;
      line-height: 1.12;
      color: var(--plum-deep);
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }
    .hero-subtitle {
      font-family: var(--font-title);
      font-size: clamp(1.4rem, 2vw, 1.8rem);
      font-weight: 400;
      font-style: italic;
      color: var(--rosa-seco);
      margin-bottom: 2.2rem;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--sage-green);
      color: #FFFFFF;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.25s, transform 0.2s, box-shadow 0.2s;
      display: inline-block;
      box-shadow: 0 4px 16px rgba(74, 107, 93, 0.25);
    }
    .btn-primary:hover {
      background: var(--sage-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 107, 93, 0.35);
    }

    .btn-secondary {
      border: 1.5px solid var(--rosa-seco);
      color: var(--plum-deep);
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-block;
      background: transparent;
    }
    .btn-secondary:hover {
      border-color: var(--plum-deep);
      background: rgba(140, 99, 116, 0.08);
      transform: translateY(-2px);
    }

    .hero-badge-container {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 1.2rem;
    }
    .hero-badge {
      background: var(--plum-deep);
      color: var(--bg-canvas);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.4rem 1.2rem;
      border-radius: 100px;
    }

    .hero-services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .hero-service-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(140, 99, 116, 0.15);
      border-radius: 16px;
      padding: 1.3rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 4px 20px rgba(61, 43, 61, 0.03);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .hero-service-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(61, 43, 61, 0.07);
    }
    .hero-service-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--sage-green);
      flex-shrink: 0;
    }
    .hero-service-text {
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.4;
    }

    /* ── ESTILOS COMUNES DE SECCIÓN ── */
    .section-inner { max-width: 1140px; margin: 0 auto; }
    
    .section-label {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--rosa-seco);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .section-label::before {
      content: '';
      display: block;
      width: 1.8rem;
      height: 2px;
      background: var(--sage-green);
    }

    .section-title {
      font-family: var(--font-title);
      font-size: clamp(2.2rem, 3.2vw, 3.2rem);
      font-weight: 500;
      line-height: 1.18;
      color: var(--plum-deep);
      margin-bottom: 2rem;
      letter-spacing: -0.01em;
    }
    .section-title em { font-style: italic; color: var(--rosa-seco); }

    /* ── SOBRE MÍ ── */
    .sobre-mi {
      background: #FFFFFF;
      padding: 6rem 2rem;
      border-top: 1px solid rgba(140, 99, 116, 0.08);
      border-bottom: 1px solid rgba(140, 99, 116, 0.08);
    }
    .sobre-mi-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 5rem;
      align-items: start;
    }
    .photo-col {
      position: sticky;
      top: 7rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .photo-frame {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 
        0 0 0 6px var(--bg-subtle),
        0 12px 36px rgba(61, 43, 61, 0.12);
      border: 2px solid rgba(140, 99, 116, 0.2);
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      filter: saturate(0.92) brightness(1.02);
      display: block;
    }

    .name-block {
      text-align: center;
      padding: 1rem 1.4rem;
      background: var(--bg-canvas);
      border-radius: 16px;
      border: 1px solid var(--rosa-pale);
      width: 100%;
    }
    .name-block-name {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--plum-deep);
      display: block;
    }
    .name-block-role {
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--rosa-seco);
      display: block;
      margin-top: 0.2rem;
    }

    .about-text p {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text-mid);
      margin-bottom: 1.4rem;
    }

    .values-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 2.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--rosa-pale);
    }
    .value-item {
      background: var(--bg-canvas);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(140, 99, 116, 0.12);
    }
    .value-number {
      font-family: var(--font-title);
      font-size: 2rem;
      font-weight: 500;
      color: var(--sage-green);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .value-text strong {
      display: block;
      font-family: var(--font-title);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--plum-deep);
      margin-bottom: 0.4rem;
    }
    .value-text p {
      font-size: 0.95rem !important;
      line-height: 1.6 !important;
      color: var(--text-mid) !important;
      margin-bottom: 0 !important;
    }

    /* ── SESIONES ── */
    .services {
      background: var(--bg-canvas);
      padding: 6rem 2rem;
    }
    .services-header { text-align: center; margin-bottom: 3.5rem; }
    .services-intro {
      font-family: var(--font-body);
      font-size: 1.05rem;
      color: var(--text-mid);
      max-width: 680px;
      line-height: 1.8;
      margin: 0 auto;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.8rem;
    }
    .service-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 2.4rem 2rem;
      border: 1px solid rgba(140, 99, 116, 0.12);
      box-shadow: 0 4px 20px rgba(61, 43, 61, 0.03);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }
    .service-card:hover { 
      transform: translateY(-5px); 
      box-shadow: 0 12px 32px rgba(61, 43, 61, 0.08); 
    }
    .service-title {
      font-family: var(--font-title);
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--plum-deep);
      margin-bottom: 1rem;
      line-height: 1.25;
    }
    .service-desc {
      font-size: 0.98rem;
      line-height: 1.75;
      color: var(--text-mid);
      margin-bottom: 1.5rem;
    }
    .service-note {
      margin-top: auto;
      padding-top: 1.2rem;
      border-top: 1px dashed var(--rosa-pale);
      font-style: italic;
      color: var(--rosa-seco);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    /* ── FAQ ── */
    .faq {
      background: #FFFFFF;
      padding: 6rem 2rem;
      border-top: 1px solid rgba(140, 99, 116, 0.08);
    }
    .faq-header { text-align: center; margin-bottom: 3.5rem; }
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .faq-item {
      background: var(--bg-
